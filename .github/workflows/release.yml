name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v2.4.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 🚀 Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-java25-release-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-java25-

      - name: 🔨 Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: 🏷️ Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: 📤 Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chunkcopy-release-${{ steps.version.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: 📢 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Chunk Copy ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            build/libs/*.jar
          body: |
            ## Chunk Copy ${{ steps.version.outputs.version }}

            ### Installation
            1. Download the `.jar` file below
            2. Place it in your `mods/` folder
            3. Requires **Fabric Loader 0.19.3+**, **Fabric API**, and **Minecraft 26.2**

            ### ⚠️ Warning
            This mod does not feature undo/redo. Be careful when pasting chunks.
