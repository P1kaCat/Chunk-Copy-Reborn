name: Fabric 26.2 Build

on:
  push:
    branches:
      - fabric-26.2
  pull_request:
    branches:
      - fabric-26.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --stacktrace
